# Non-secret manifest: maps Actions secret names to their Cloudflare source.
# Applied with the Ops in Net `actions_sync_secrets` tool; values never live here.
# Each app has its own signing key; the publish token is shared (it only authorises uploads).
secrets:
  SIGNING_KEYSTORE_B64: r2/dinosoft-signing/infinite-scroll.jks.b64
  SIGNING_KEYSTORE_PASSWORD: secrets_store/INFINITE_SCROLL_KEYSTORE_PASSWORD
  DINOSOFT_PUBLISH_TOKEN: secrets_store/DINOSOFT_PUBLISH_TOKEN
