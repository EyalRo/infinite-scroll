<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infinite Scroll — Post design</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body>
<header class="site-header"><a class="brand" href="/"><span class="brand-mark"><span></span><span></span><span></span></span><span><strong>Infinite Scroll</strong><small>Thermal print studio</small></span></a><nav><a href="/">Studio</a><a class="active" href="/design">Post design</a></nav><a class="artist-link" href="https://halfcathalfpizza.com/" target="_blank" rel="noreferrer">A project by <strong>Half Cat Half Pizza ↗</strong></a></header>
<main class="design-layout"><section class="panel"><div class="section-heading"><div><p class="eyebrow">Template</p><h2>Print stylesheet</h2></div><span class="step">CSS</span></div><textarea id="css-editor" spellcheck="false">{{ css_text }}</textarea><div class="form-actions"><button class="button primary" id="save-btn">Save stylesheet <span>→</span></button><span id="save-status" class="next-print">Unsaved edits preview automatically.</span></div></section><section class="panel design-preview"><div class="section-heading"><div><p class="eyebrow">650 dots wide</p><h2>Thermal preview</h2></div></div><img id="preview-img" alt="Rendered post preview"></section></main>
<script>const editor=document.getElementById("css-editor"),preview=document.getElementById("preview-img"),status=document.getElementById("save-status");let timer;async function render(){status.textContent="Rendering…";const response=await fetch("/design/preview",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({css:editor.value})}),data=await response.json();if(data.image){preview.src=data.image;status.textContent="Preview current"}else status.textContent=data.error||"Preview failed"}editor.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(render,500)});document.getElementById("save-btn").addEventListener("click",async()=>{const response=await fetch("/design",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({css:editor.value})}),data=await response.json();status.textContent=data.success?"Saved ✓":"Save failed"});render();</script></body></html>
